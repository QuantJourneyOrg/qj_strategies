[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantjourney-strategies"
version = "0.1.0"
description = "Causal strategy examples for the QuantJourney backtester"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "quantjourney-bt>=0.10.0,<0.11",
  "numpy>=1.24",
  "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["_strategies_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
